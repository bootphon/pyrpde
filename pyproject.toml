[build-system]
requires = ["setuptools>=38.6.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrpde"
version = "0.1.3"
description = "A Python implementation of the Recurrence Period Density Entropy (RPDE)"
readme = "README.md"
requires-python = ">=3.6"
license = { text = "MIT" }
authors = [
    { name = "Hadrien Titeux & Rachid Riad", email = "hadrien.titeux@ens.fr" }
]
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numba>=0.49.1",
    "numpy>=1.18.4",
    "scipy>=1.4.1"
]

[project.urls]
Homepage = "https://github.com/bootphon/pyrpde"

[tool.setuptools]
packages = ["pyrpde"]